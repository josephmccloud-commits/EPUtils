name: Compile Browser Extensions

on:
  push:
    tags:
      - 'v*' # Triggers the build automatically whenever you push a version tag (e.g. v3.3)
  workflow_dispatch: # Allows you to manually click "Run workflow" from the GitHub UI for testing

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the repository code
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Compile .crx, .xpi, and source .zip via BEPP
    - name: Compile Extension Formats
      uses: pigeonposse/bepp@1.3.17
      with:
        source: '.' 
        chrome-key: ${{ secrets.CHROME_PRIVATE_KEY }}
        output-name: 'ep-utilities'

    # 3. Create the GitHub Release and upload the generated assets
    - name: Create GitHub Release and Upload Bundles
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/ep-utilities.crx
          dist/ep-utilities.xpi
          dist/ep-utilities.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
