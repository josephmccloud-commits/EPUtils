name: Compile Browser Extensions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch your code
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Set up the exact Node environment BEPP needs
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # 3. Export the Chrome secret key as an environment variable for BEPP
    - name: Export Chrome Key
      run: echo "${{ secrets.CHROME_PRIVATE_KEY }}" > chrome.pem

    # 4. Run BEPP natively using its strict file parameter rule
    - name: Compile Extension Formats
      uses: pigeonposse/bepp@v1
      with:
        file: './bepp.config.json'
      env:
        BEPP_CHROME_KEY: './chrome.pem'

    # 5. Create the GitHub Release and grab the files from BEPP's default output directory
    - name: Create GitHub Release and Upload Bundles
      uses: softprops/action-gh-release@v2
      with:
        files: |
          .bepp/ep-utilities.crx
          .bepp/ep-utilities.xpi
          .bepp/ep-utilities.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
