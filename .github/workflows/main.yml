name: Compile Browser Extensions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down your repository code
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Use bepp to automatically compile .crx, .xpi, and source .zip files
    - name: Compile Extension Formats
      uses: pigeonposse/bepp@1.3.17
      with:
        source: '.'                    # Path to your extension folder
        chrome-key: ${{ secrets.CHROME_PRIVATE_KEY }}
        output-name: 'ep-utilities'     # Base name for the generated files

    # 3. Create the GitHub Release and upload all the compiled assets
    - name: Create GitHub Release and Upload Bundles
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/ep-utilities.crx
          dist/ep-utilities.xpi
          dist/ep-utilities.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
